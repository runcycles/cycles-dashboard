# Security headers applied to every response served by the bundled nginx.
#
# Kept in an include (not inline in default.conf.template) because nginx's
# add_header does NOT merge across levels: any location block that declares
# its own add_header (e.g. the Cache-Control locations in
# default.conf.template) silently drops ALL inherited server-level headers.
# Every such location re-includes this file so the security headers keep
# applying everywhere. If you add a new add_header to any location, include
# this snippet there too.
#
# Copied by the Dockerfile to /etc/nginx/snippets/security-headers.conf.
# Not an envsubst template — contains no substitutable variables.
#
# Note: HSTS belongs at the TLS terminator (nginx-ssl.conf.example /
# Caddyfile.example), not here on the plain-HTTP container port.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
