name: Container Scan

# Runs Trivy against a locally-built image on PRs that change the Dockerfile,
# npm dependencies, or nginx config baked into the image, AND on every push
# to main with the same paths filter. Paths filter keeps the scan off
# source-only PRs — building the full image adds ~5-10 min even with cache.
#
# The push:main trigger ensures stale Trivy alerts auto-close after a fix
# lands — without it, the SARIF only ever uploads against PR refs and the
# main-branch alert track goes stale after every fix merge.
#
# Never pushes images — this is feedback only. release.yml continues to run
# the authoritative scan at release publish time (with the real version tag).

on:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'default.conf.template'
      - '.github/workflows/pr-container-scan.yml'
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - 'package.json'
      - 'package-lock.json'
      - 'default.conf.template'
      - '.github/workflows/pr-container-scan.yml'

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write   # required for Trivy SARIF upload to Security tab

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image (load for scan, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          load: true
          tags: ghcr.io/runcycles/cycles-dashboard:scan-${{ github.event.pull_request.number || github.sha }}
          # no-cache + pull are critical for security scans: a cached
          # `apk upgrade` layer will keep reporting old packages even after
          # a base-image bump (witnessed in PR #157 — FROM was bumped to
          # nginx:1.29-alpine3.23 but cached `apk upgrade` layer still
          # served nghttp2 1.68.0/xz 5.8.2 from a months-old build).
          # We want to scan what would actually be built today.
          no-cache: true
          pull: true

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/runcycles/cycles-dashboard:scan-${{ github.event.pull_request.number || github.sha }}
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '1'

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          sarif_file: 'trivy-results.sarif'
          category: trivy-container-pr   # category kept stable so push-to-main scans clear PR-track alerts
