x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    logging: *default-logging
    # Pinned to the current stable minor (floating 2-alpine could silently
    # jump majors/minors). Bump deliberately.
    image: caddy:2.11-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - cycles

  dashboard:
    logging: *default-logging
    image: ghcr.io/runcycles/cycles-dashboard:0.1.25.83
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # The image bundles an nginx reverse proxy that splits /v1/* traffic
    # between the two planes. These default to the compose service names,
    # so they only need overriding when the admin / runtime servers live
    # elsewhere (split hosts, external endpoints, non-default ports).
    environment:
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-http://cycles-admin:7979}
      RUNTIME_UPSTREAM: ${RUNTIME_UPSTREAM:-http://cycles-server:7878}
    depends_on:
      cycles-admin:
        condition: service_healthy
      cycles-server:
        condition: service_healthy
    networks:
      - cycles

  cycles-server:
    logging: *default-logging
    # Runtime-plane server. Release cadence is independent of dashboard +
    # cycles-server-admin. .58 is the latest published runtime release and
    # rolls up reservation/evidence, replay, pagination, Redis recovery,
    # scheduled-maintenance, and observability hardening through .58.
    image: ghcr.io/runcycles/cycles-server:0.1.25.58
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The JVM sizes its heap as 75% of the *container* limit
    # (MaxRAMPercentage below). Without a limit it sees the whole host and
    # the two JVMs can overcommit it together. Env-parameterized so large
    # fleets can raise it without editing this file — the 2g default
    # (≈1.5g heap) suits small/mid fleets; see OPERATIONS.md "Memory
    # limits" for sizing guidance.
    deploy:
      resources:
        limits:
          memory: ${CYCLES_SERVER_MEM_LIMIT:-2g}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication"
      CYCLES_METRICS_TENANT_TAG_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_ORIGIN:-https://admin.example.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7878/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-events:
    logging: *default-logging
    # Event-dispatch / webhook delivery worker. Consumes events from
    # Redis and fans them out to registered webhook endpoints. Keep
    # pinned to the latest published worker. .25 adds a fail-closed signing-
    # secret key and always-on private-network SSRF baseline on top of .24's
    # owner-fenced dispatch, durable terminal transitions, and evidence work.
    # Evidence-enabled upgrades MUST follow OPERATIONS.md's .24 processing-
    # list migration sequence before starting the new worker.
    image: ghcr.io/runcycles/cycles-server-events:0.1.25.25
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # See cycles-server note — env-parameterized, 2g default.
    deploy:
      resources:
        limits:
          memory: ${CYCLES_EVENTS_MEM_LIMIT:-2g}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY must be set}
      WEBHOOK_SECRET_ALLOW_PLAINTEXT: "false"
      CYCLES_METRICS_TENANT_TAG_ENABLED: "false"
      EVENT_TTL_DAYS: ${EVENT_TTL_DAYS:-90}
      DELIVERY_TTL_DAYS: ${DELIVERY_TTL_DAYS:-14}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9980/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-admin:
    logging: *default-logging
    image: ghcr.io/runcycles/cycles-server-admin:0.1.25.54
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # See cycles-server note — heap is sized off this limit.
    # Env-parameterized, 2g default.
    deploy:
      resources:
        limits:
          memory: ${CYCLES_ADMIN_MEM_LIMIT:-2g}
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY must be set}
      WEBHOOK_SECRET_ALLOW_PLAINTEXT: "false"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication"
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_ORIGIN:-https://admin.example.com}
      EVENT_TTL_DAYS: ${EVENT_TTL_DAYS:-90}
      DELIVERY_TTL_DAYS: ${DELIVERY_TTL_DAYS:-14}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7979/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  redis:
    logging: *default-logging
    # Pinned to the current stable 7.x minor (floating 7-alpine could
    # silently jump minors). Bump deliberately.
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # Keep REDIS_MAXMEMORY (dataset cap, below) comfortably under this
    # cgroup limit — AOF rewrites and persistence forks need headroom
    # beyond the dataset, and a cgroup-only limit ends in a kernel
    # OOM-kill → AOF-replay crash loop that takes down all three planes.
    # Defaults leave 256m of headroom.
    deploy:
      resources:
        limits:
          memory: ${REDIS_MEM_LIMIT:-768m}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    # --maxmemory-policy noeviction: governance data (budgets, ledgers,
    # audit) must never be silently evicted. Hitting the cap produces
    # visible write errors (OOM command not allowed) the operators can
    # act on, instead of Redis quietly dropping keys or the kernel
    # OOM-killing the container.
    command: ["sh", "-c", "redis-server --appendonly yes --maxmemory ${REDIS_MAXMEMORY:-512mb} --maxmemory-policy noeviction --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cycles

volumes:
  redis-data:
  caddy-data:

networks:
  cycles:
