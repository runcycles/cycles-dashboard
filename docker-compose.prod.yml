x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  caddy:
    logging: *default-logging
    # Pinned to the current stable minor (floating 2-alpine could silently
    # jump majors/minors). Bump deliberately.
    image: caddy:2.11-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
    depends_on:
      dashboard:
        condition: service_healthy
    networks:
      - cycles

  dashboard:
    logging: *default-logging
    image: ghcr.io/runcycles/cycles-dashboard:0.1.25.68
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    # The image bundles an nginx reverse proxy that splits /v1/* traffic
    # between the two planes. These default to the compose service names,
    # so they only need overriding when the admin / runtime servers live
    # elsewhere (split hosts, external endpoints, non-default ports).
    environment:
      ADMIN_UPSTREAM: ${ADMIN_UPSTREAM:-http://cycles-admin:7979}
      RUNTIME_UPSTREAM: ${RUNTIME_UPSTREAM:-http://cycles-server:7878}
    depends_on:
      cycles-admin:
        condition: service_healthy
      cycles-server:
        condition: service_healthy
    networks:
      - cycles

  cycles-server:
    logging: *default-logging
    # Runtime-plane server. Release cadence is independent of dashboard +
    # cycles-server-admin. Pinned to .46 for dashboard 0.1.25.66: adds
    # default-on 429 rate limiting on the public evidence/JWKS endpoints
    # (anonymous surface only; dashboard traffic is far below the limit); it
    # surfaces reservation committed/finalized/metadata, the include=
    # projection on listReservations — including include=evidence, the
    # reservation->evidence link — and serves /v1/evidence + the signer
    # JWKS the Evidence view consumes. Older runtime servers still work —
    # the dashboard degrades gracefully (fields omitted, 404 on evidence) —
    # but the full Reservations/Evidence surface needs .37+. .38 also
    # stops queuing evidence source records when evidence is unconfigured.
    image: ghcr.io/runcycles/cycles-server:0.1.25.46
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # The JVM sizes its heap as 75% of the *container* limit
    # (MaxRAMPercentage below). Without a limit it sees the whole host and
    # the two JVMs can overcommit it together.
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication"
      CYCLES_METRICS_TENANT_TAG_ENABLED: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_ORIGIN:-https://admin.example.com}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7878/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-events:
    logging: *default-logging
    # Event-dispatch / webhook delivery worker. Consumes events from
    # Redis and fans them out to registered webhook endpoints. Keep
    # pinned to the version published alongside the current cycles-admin
    # release — bump in lockstep with protocol revisions that affect
    # WebhookDelivery. `.14` ("CyclesEvidence signing tier") adds the
    # evidence-envelope signer (consumes evidence:pending) on top of the
    # trace_id / trace_flags / traceparent_inbound_valid WebhookDelivery
    # fields — needed for the Evidence viewer when evidence emission is on.
    # `.15` gates the signer on evidence config (no dead-letter / failed-queue
    # noise when unconfigured) + fixes a retention-scan WRONGTYPE error.
    image: ghcr.io/runcycles/cycles-server-events:0.1.25.22
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY must be set}
      CYCLES_METRICS_TENANT_TAG_ENABLED: "false"
      EVENT_TTL_DAYS: ${EVENT_TTL_DAYS:-90}
      DELIVERY_TTL_DAYS: ${DELIVERY_TTL_DAYS:-14}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9980/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-admin:
    logging: *default-logging
    image: ghcr.io/runcycles/cycles-server-admin:0.1.25.48
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # See cycles-server note — heap is sized off this limit.
    deploy:
      resources:
        limits:
          memory: 1g
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_API_KEY: ${ADMIN_API_KEY:?ADMIN_API_KEY must be set}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:?WEBHOOK_SECRET_ENCRYPTION_KEY must be set}
      WEBHOOK_SECRET_ENCRYPTION_REQUIRED: "true"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -XX:+UseG1GC -XX:+UseStringDeduplication"
      DASHBOARD_CORS_ORIGIN: ${DASHBOARD_ORIGIN:-https://admin.example.com}
      EVENT_TTL_DAYS: ${EVENT_TTL_DAYS:-90}
      DELIVERY_TTL_DAYS: ${DELIVERY_TTL_DAYS:-14}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7979/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  redis:
    logging: *default-logging
    # Pinned to the current stable 7.x minor (floating 7-alpine could
    # silently jump minors). Bump deliberately.
    image: redis:7.4-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cycles

volumes:
  redis-data:
  caddy-data:

networks:
  cycles:
