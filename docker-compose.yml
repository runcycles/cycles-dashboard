x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  dashboard:
    logging: *default-logging
    build: .
    # All dev-stack ports bind to loopback: this stack runs with a blank
    # REDIS_PASSWORD and a default admin key, so nothing here may be
    # reachable from other hosts (0.0.0.0 was a remote-exposure footgun).
    ports:
      - "127.0.0.1:8080:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    depends_on:
      cycles-admin:
        condition: service_healthy
      cycles-server:
        condition: service_healthy
    networks:
      - cycles

  cycles-server:
    logging: *default-logging
    # Runtime-plane server. Independent release cadence from dashboard +
    # cycles-server-admin — keep in sync with docker-compose.prod.yml.
    # .58 is the latest published runtime release: it includes the complete
    # reservation/evidence surface plus replay, pagination, Redis recovery,
    # scheduled-maintenance, and observability hardening from .47-.58.
    image: ghcr.io/runcycles/cycles-server:0.1.25.58
    restart: unless-stopped
    ports:
      - "127.0.0.1:7878:7878"  # loopback-only — see dashboard service note
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-key}
      # Runtime-plane CORS: same rationale as cycles-admin (below) — accept
      # both docker (:8080) and Vite dev (:5173/:5174) origins so
      # ReservationsView's /v1/reservations calls don't 403 during dev.
      DASHBOARD_CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:5174
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7878/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-events:
    logging: *default-logging
    # Event-dispatch / webhook delivery worker. Consumes events emitted
    # by cycles-admin and cycles-server from Redis and fans them out
    # to registered webhook endpoints. Independent release cadence.
    # .25 keeps .24's owner-fenced dispatch and durable evidence work, then
    # adds an always-on private-network SSRF baseline and fail-closed secret
    # encryption. Local Docker-network delivery uses the explicit dev escape.
    # Existing evidence-enabled fleets must follow OPERATIONS.md's .24
    # processing-list migration sequence before upgrading.
    image: ghcr.io/runcycles/cycles-server-events:0.1.25.25
    restart: unless-stopped
    ports:
      - "127.0.0.1:7980:7980"  # loopback-only — see dashboard service note
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      # Local-only defaults, overrideable for security-path testing.
      # Production requires one shared 32-byte key and keeps both opt-outs off.
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      WEBHOOK_SECRET_ALLOW_PLAINTEXT: ${WEBHOOK_SECRET_ALLOW_PLAINTEXT:-true}
      WEBHOOK_URL_GUARD_ALLOW_PRIVATE_NETWORKS: ${WEBHOOK_URL_GUARD_ALLOW_PRIVATE_NETWORKS:-true}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9980/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  cycles-admin:
    logging: *default-logging
    image: ghcr.io/runcycles/cycles-server-admin:0.1.25.54
    restart: unless-stopped
    ports:
      - "127.0.0.1:7979:7979"  # loopback-only — see dashboard service note
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-key}
      WEBHOOK_SECRET_ENCRYPTION_KEY: ${WEBHOOK_SECRET_ENCRYPTION_KEY:-}
      WEBHOOK_SECRET_ALLOW_PLAINTEXT: ${WEBHOOK_SECRET_ALLOW_PLAINTEXT:-true}
      # Allow the docker dashboard origin (:8080) plus Vite's dev origins
      # (:5173 and :5174 fallback when :5173 is in TIME_WAIT from a prior
      # run). Spring's CorsFilter rejects mismatches with 403 "Invalid CORS
      # request" before reaching the AuthInterceptor — so a missing origin
      # surfaces as a 403 in DevTools with zero admin-server logs.
      DASHBOARD_CORS_ORIGIN: http://localhost:8080,http://localhost:5173,http://localhost:5174
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:7979/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cycles

  redis:
    logging: *default-logging
    # Pinned to the 7.4 minor (matches docker-compose.prod.yml) to prevent
    # silent major/minor drift under the floating 7-alpine tag.
    image: redis:7.4-alpine
    ports:
      # Loopback-only: this dev redis has NO password ("" above) — binding
      # 0.0.0.0 would expose an open redis to the local network.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cycles

volumes:
  redis-data:

networks:
  cycles:
